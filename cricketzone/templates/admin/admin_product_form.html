{% extends "admin/admin_base.html" %}
{% block title %}{{ action }} Product – CricketZone Admin{% endblock %}
{% block page_title %}{{ action }} Product{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="admin-card">
      <div class="admin-card-header">
        <h6 class="mb-0">
          <i class="bi bi-{{ 'plus-circle' if action == 'Add' else 'pencil' }} me-2"></i>
          {{ action }} Product
        </h6>
      </div>
      <div class="admin-card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold">Product Name *</label>
              <input type="text" name="name" class="form-control cz-input"
                     value="{{ product.name if product else '' }}" required />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Category *</label>
              <select name="category" class="form-select cz-input" required>
                <option value="">-- Select --</option>
                {% for cat in ['bat','ball','kit'] %}
                <option value="{{ cat }}"
                  {{ 'selected' if product and product.category == cat else '' }}>
                  {{ cat|title }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Description *</label>
              <textarea name="description" class="form-control cz-input" rows="4" required>{{ product.description if product else '' }}</textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Price (₹) *</label>
              <input type="number" name="price" class="form-control cz-input"
                     step="0.01" min="0"
                     value="{{ product.price if product else '' }}" required />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Stock Quantity *</label>
              <input type="number" name="stock" class="form-control cz-input"
                     min="0" value="{{ product.stock if product else '' }}" required />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Image Filename</label>
              <input type="text" name="image" class="form-control cz-input"
                     placeholder="bat9.jpg"
                     value="{{ product.image if product else '' }}" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Brand</label>
              <input type="text" name="brand" class="form-control cz-input"
                     value="{{ product.brand if product else '' }}" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Weight</label>
              <input type="text" name="weight" class="form-control cz-input"
                     placeholder="1.20 kg"
                     value="{{ product.weight if product else '' }}" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Size / Handle</label>
              <input type="text" name="size" class="form-control cz-input"
                     placeholder="Short Handle"
                     value="{{ product.size if product else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Material</label>
              <input type="text" name="material" class="form-control cz-input"
                     placeholder="English Willow Grade A"
                     value="{{ product.material if product else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Grade</label>
              <input type="text" name="grade" class="form-control cz-input"
                     placeholder="Grade A"
                     value="{{ product.grade if product else '' }}" />
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <button type="submit" class="btn btn-admin-primary">
                <i class="bi bi-check-circle me-2"></i>{{ action }} Product
              </button>
              <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle me-2"></i>Cancel
              </a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
